<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Gesso — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <img src="img/logo.png" alt="VE Gesso" class="login-card__logo" />
    <h1>Sistema Gesso</h1>
    <p class="login-card__sub">Instalações e Forros</p>

    <form id="login-form">
      <label for="login">Usuário</label>
      <input type="text" id="login" name="login" autocomplete="username" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required />

      <button type="submit" class="btn form-full">Entrar</button>
    </form>

    <p id="mensagem" class="mensagem" hidden></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
